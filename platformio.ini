
; ===================================================================================
; Install PlatformIO and CH32V:
; https://pio-ch32v.readthedocs.io/en/latest/
; https://github.com/Community-PIO-CH32V/platform-ch32v
; ===================================================================================

[platformio]

src_dir = src_os
; Uncomment to build a specific game instead of the bootloader:
; src_dir = src_games/3in1A
default_envs = lab_machines

[env:CH32X035]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
framework = arduino
board = phsi245_gameboy
board_build.variants_dir = variant
; Prepend framework_overrides/ to the include path so the repo's
; startup_ch32x035.S (machine-mode 0x1888) overrides the framework's copy.
; The post: hook checks the bootloader image (check_boot.py) and wraps game
; builds (mkapp.py); see prog_tools/pio_post_build.py.
extra_scripts =
    pre:framework_overrides/override_startup.py
    post:prog_tools/pio_post_build.py
build_flags = -I. -D F_CPU=48000000 -D NO_GLOBAL_EEPROM
board_build.use_lto = yes
; Keep upload_protocol = minichlink (not custom): with it, $SOURCE resolves to
; the env's freshly built firmware.bin, which the wrapper needs.
upload_protocol = minichlink
; prog_tools/pio_upload.py decides what to program from $PROJECT_SRC_DIR:
; src_os -> chip_tool flash (bootloader), src_games/<Name> -> flash-pair.
; $PYTHONEXE is PlatformIO's bundled Python; if it lacks pyusb/chprog the
; wrapper re-execs under python3/python/py. Install the deps with:
;   pip install chprog
upload_command = "$PYTHONEXE" prog_tools/pio_upload.py $SOURCE $PROJECT_SRC_DIR $PROJECT_DIR

[env:lab_machines]
extends = env:CH32X035

[env:v2]
extends = env:lab_machines
