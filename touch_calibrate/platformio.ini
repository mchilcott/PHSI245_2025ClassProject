; ===================================================================================
; Touch button calibration tool for the PHSI245 class project board (CH32X035).
; Shows the raw capacitive readings for PA0..PA5 on the OLED and over USB serial.
;
; Board definition, pin variant and HAL/Arduboy2 libraries are shared with
; ../, the USB serial library is ../CH32X035_USBSerial.
; ===================================================================================

[platformio]
default_envs = lab_machines
boards_dir = ../boards

[env:CH32X035]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
framework = arduino
board = phsi245_gameboy
board_build.variants_dir = ..//variant
build_flags = -I. -D F_CPU=48000000 -D NO_GLOBAL_EEPROM
board_build.use_lto = yes
lib_extra_dirs = ..//lib
lib_deps = https://github.com/jobitjoseph/CH32X035_USBSerial.git
upload_protocol = minichlink
upload_command = chprog $SOURCE
monitor_speed = 115200

[env:lab_machines]
extends = env:CH32X035
# Need to run pip install chprog in pio terminal first.
upload_protocol = minichlink
upload_command = python3 ../prog_tools/program.py $SOURCE
